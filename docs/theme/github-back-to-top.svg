<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Volver arriba</title>
  <desc id="desc">Flecha hacia arriba sobre un botón circular oscuro con borde azul. Fondo transparente.</desc>
  <defs>
