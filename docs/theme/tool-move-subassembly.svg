</style><title id="title">Move SubAssembly</title><desc id="description">Move SubAssembly Move CAD parts between SubAssemblies using drag and drop. Allows the user to reorganize the manufacturing structure by dragging CAD parts from one SubAssembly to another directly within the FreeCAD tree view. Drag &amp; Drop Reorganization: Move parts between different SubAssemblies using the tree interface. SubAssembly Assignment: Changes the manufacturing group to which a CAD part belongs. Hierarchy Organization: Keeps the project structure organized after parts are reassigned.</desc>
