</style><title id="title">Assign Positions</title><desc id="description">Assign Positions Assign manufacturing positions to SubAssemblies Links each manufacturing SubAssembly with the physical welding workstation or Position where its welding operations will be performed. Workstation Mapping: Assigns welding Positions to specific SubAssemblies. Drag &amp; Drop Assignment: Provides an intuitive interface for connecting SubAssemblies with their corresponding manufacturing Positions. Automatic Data Inheritance: Propagates manufacturing information through the hierarchy: SubAssembly → Position → Robot → Weld.</desc>
