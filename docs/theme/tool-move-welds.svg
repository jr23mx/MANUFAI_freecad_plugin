</style><title id="title">Move Welds</title><desc id="description">Move Welds Reassign weld trajectories between robots using drag and drop. Allows the user to move weld trajectories from one robot to another directly within the manufacturing hierarchy, simplifying robot assignment and welding sequence organization. Drag &amp; Drop Reassignment: Move welds between robots using an intuitive tree-based interface. Robot Assignment: Quickly change which robot is responsible for executing a specific weld. Hierarchy Update: Updates the weld position inside the manufacturing structure after reassignment.</desc>
