</style><title id="title">Weld Length Report</title><desc id="description">Weld Length Report Production Reports &amp; Quotations Automatically extracts the total linear distance of all weld beads within the active document. This tool is essential for estimating filler metal consumption, wire usage, and overall project costs. Smart Grouping: Organizes the exported data hierarchically by SubAssembly, Position, and specific Robot. Unit Conversion: Allows on-the-fly conversion between metric and imperial units (mm, cm, m, in, ft, etc.). Direct Excel Export: Generates a clean, formatted .xlsx workbook ready for your purchasing and planning departments.</desc>
